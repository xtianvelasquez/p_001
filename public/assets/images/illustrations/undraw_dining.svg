  <path d="M 420,235 Q 380,240 360,250" stroke="#0f172a" stroke-width="14" stroke-linecap="round" fill="none" />
  <circle cx="358" cy="250" r="6" fill="#e0a97a" />
  <!-- Floating wine glass in hand -->
  <path d="M 353,235 L 361,235 L 359,246 L 355,246 Z" fill="#b45309" opacity="0.85" />
  <line x1="357" y1="246" x2="357" y2="252" stroke="#64748b" stroke-width="1.5" />

  <!-- Celebratory Accent Sparkles (unDraw style clean stars) -->
  <path d="M 298,175 Q 300,168 302,175 Q 309,177 302,179 Q 300,186 298,179 Q 291,177 298,175 Z" fill="#fbbf24" />
  <path d="M 320,195 Q 321,190 323,195 Q 328,196 323,197 Q 321,202 320,197 Q 315,196 320,195 Z" fill="#f59e0b" opacity="0.8" />
  <path d="M 280,192 Q 281,188 283,192 Q 287,193 283,194 Q 281,198 280,194 Q 276,193 280,192 Z" fill="#f59e0b" opacity="0.7" />
</svg>
