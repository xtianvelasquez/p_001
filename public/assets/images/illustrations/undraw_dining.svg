  <path d="M 435,225 C 420,225 400,235 395,265 L 405,325 L 443,325 L 447,255 Z" fill="#0f172a" />
  <!-- Scarf / Accent Collar in Amber -->
  <path d="M 412,223 C 418,228 428,228 434,223 L 428,245 Z" fill="#f59e0b" />
  <!-- Head & Hair (Right Character) -->
  <ellipse cx="418" cy="180" rx="15" ry="18" fill="#e0a97a" />
  <!-- Hair: unDraw modern bun / styled hair -->
  <path d="M 434,178 C 438,160 422,150 406,152 C 398,154 394,162 400,172 C 404,178 412,168 420,165 C 428,162 432,172 432,182 Z" fill="#1e293b" />
  <circle cx="433" cy="155" r="9" fill="#1e293b" />
  <!-- Neck -->
  <rect x="414" y="196" width="9" height="10" fill="#e0a97a" rx="2" />
