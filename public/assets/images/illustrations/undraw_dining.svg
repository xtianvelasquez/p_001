<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="softFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadows (unDraw style floor ellipse) -->
  <ellipse cx="300" cy="405" rx="240" ry="18" fill="url(#softFloor)" />
  <ellipse cx="170" cy="408" rx="70" ry="9" fill="#0f172a" opacity="0.08" />
  <ellipse cx="430" cy="408" rx="70" ry="9" fill="#0f172a" opacity="0.08" />
  <ellipse cx="300" cy="412" rx="90" ry="8" fill="#0f172a" opacity="0.07" />

  <!-- Backdrop / Ambient Floating Elements -->
  <circle cx="90" cy="90" r="32" fill="#fef3c7" opacity="0.6" />
  <circle cx="510" cy="110" r="22" fill="#fef3c7" opacity="0.5" />
