  <path d="M 295,245 C 292,255 290,262 300,265 C 310,262 308,255 305,245 Z" fill="#b45309" />
  <path d="M 300,245 Q 295,230 300,220" stroke="#059669" stroke-width="2" fill="none" />
  <circle cx="300" cy="218" r="5" fill="#f59e0b" />
  <circle cx="295" cy="222" r="3.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="305" cy="222" r="3.5" fill="#f59e0b" opacity="0.8" />
  <!-- Plates -->
  <ellipse cx="230" cy="272" rx="24" ry="5.5" fill="#e2e8f0" />
  <ellipse cx="230" cy="270" rx="20" ry="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <ellipse cx="370" cy="272" rx="24" ry="5.5" fill="#e2e8f0" />
  <ellipse cx="370" cy="270" rx="20" ry="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <!-- Glasses with BenHub amber beverage -->
  <path d="M 262,250 L 268,250 L 266,260 L 264,260 Z" fill="#94a3b8" />
  <path d="M 261,242 L 269,242 L 268,250 L 262,250 Z" fill="#d97706" opacity="0.75" />
  <ellipse cx="265" cy="260" rx="4" ry="1.5" fill="#94a3b8" />
  <path d="M 336,250 L 342,250 L 340,260 L 338,260 Z" fill="#94a3b8" />
  <path d="M 335,242 L 343,242 L 342,250 L 336,250 Z" fill="#d97706" opacity="0.75" />
  <ellipse cx="339" cy="260" rx="4" ry="1.5" fill="#94a3b8" />

