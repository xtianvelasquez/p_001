  <!-- Chair Left -->
  <path d="M 140,230 Q 140,200 165,200 L 165,340 L 140,340 Z" fill="#334155" opacity="0.3" />
  <line x1="145" y1="330" x2="135" y2="405" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <line x1="175" y1="330" x2="170" y2="405" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <!-- Legs & Pants -->
  <path d="M 160,320 L 210,325 L 215,395 L 195,395 L 192,345 L 160,340 Z" fill="#1e293b" />
