  <path d="M 162,178 C 160,160 175,150 190,152 C 196,153 200,160 195,168 C 190,172 188,170 185,164 C 178,160 166,168 165,182 Z" fill="#0f172a" />
  <!-- Neck -->
  <rect x="173" y="196" width="9" height="10" fill="#ffdbb4" rx="2" />
  <!-- Arm & Gesture (Holding napkin/menu or resting on table) -->
  <path d="M 175,235 Q 210,245 235,268" stroke="url(#warmAmber)" stroke-width="14" stroke-linecap="round" fill="none" />
  <circle cx="236" cy="268" r="6" fill="#ffdbb4" />

  <!-- RIGHT DINER (unDraw Character 2) -->
  <!-- Chair Right -->
  <path d="M 455,230 Q 455,200 430,200 L 430,340 L 455,340 Z" fill="#334155" opacity="0.3" />
  <line x1="450" y1="330" x2="460" y2="405" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <line x1="420" y1="330" x2="425" y2="405" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <!-- Legs & Pants -->
  <path d="M 435,320 L 385,325 L 380,395 L 400,395 L 403,345 L 435,340 Z" fill="#334155" />
  <!-- Shoes -->
  <ellipse cx="376" cy="398" rx="14" ry="6" fill="#0f172a" />
